name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "latest"
          cache: true
          run-install: true

      - run: vp pack && vpr generate-rules

      - run: |
          aws s3 sync outputs/ s3://static/clash/ \
            --endpoint-url https://s3.mioyi.net \
            --exclude "*.gitkeep" \
            --no-progress
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
